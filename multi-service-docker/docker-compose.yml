# Default logging for every service: JSON files, rotated at 10MB, keep 3.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./web
      args:
        BASE_IMAGE: msd/node-base:1.0
    image: msd/web:1.0
    networks: [frontend]
    restart: unless-stopped
    logging: *logging

  api:
    build:
      context: ./api
      args:
        BASE_IMAGE: msd/node-base:1.0
    image: msd/api:1.0
    environment:
      MONGO_USER: root
      MONGO_PASSWORD_FILE: /run/secrets/mongo_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      CACHE_TTL_SECONDS: 60
    secrets: [mongo_password, redis_password]
    networks: [frontend, backend]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets: [mongo_password]
    volumes:
      - mongo-data:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # Password comes from the secret file; appendonly makes the cache survive restarts
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep PONG"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *logging

networks:
  frontend:
  backend:
    internal: true # database and cache are not reachable from outside

volumes:
  mongo-data:
  redis-data:

secrets:
  mongo_password:
    file: ./secrets/mongo_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
