name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "blue-green-deployment/**"        # has its own workflow
      - "**/README.md"
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the shell scripts
        run: |
          shopt -s globstar nullglob
          shellcheck --severity=warning \
            service-discovery/scripts/*.sh \
            multi-service-docker/scripts/*.sh \
            monitoring-prometheus-grafana/scripts/*.sh

  test:
    # Each project builds its stack and runs its own end-to-end test (scripts/test.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [service-discovery, multi-service-docker, monitoring-prometheus-grafana]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ${{ matrix.project }}/scripts/test.sh
        working-directory: ${{ matrix.project }}
        run: scripts/test.sh
