# Pre-computed queries. Dashboards and alerts use these instead of
# re-running the expensive raw expressions on every refresh.
groups:
  - name: shop-recording
    interval: 30s
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (job) (rate(http_request_duration_seconds_count[5m]))

      - record: job_route:http_requests:rate5m
        expr: sum by (job, route, status) (rate(http_request_duration_seconds_count[5m]))

      - record: job:http_errors:ratio_rate5m
        expr: |
          sum by (job) (rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
          /
          sum by (job) (rate(http_request_duration_seconds_count[5m]))

      - record: job:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

  - name: node-recording
    interval: 30s
    rules:
      - record: instance:node_cpu_utilisation:ratio
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

      - record: instance:node_memory_utilisation:ratio
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes

      - record: instance:node_filesystem_utilisation:ratio
        expr: |
          1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|erofs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|erofs"}
