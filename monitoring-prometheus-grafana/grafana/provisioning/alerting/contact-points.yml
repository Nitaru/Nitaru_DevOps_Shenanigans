apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true

  # To also send alerts to Slack, uncomment and set an incoming webhook URL:
  # - orgId: 1
  #   name: slack
  #   receivers:
  #     - uid: slack
  #       type: slack
  #       settings:
  #         url: https://hooks.slack.com/services/XXX/YYY/ZZZ

policies:
  - orgId: 1
    receiver: email
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
