log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time}';

server {
    listen 80;
    access_log /dev/stdout json;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Don't expose the app's /metrics publicly; Prometheus scrapes the app directly
    location = /metrics {
        return 404;
    }

    # Read by nginx-prometheus-exporter
    location = /stub_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }
}
