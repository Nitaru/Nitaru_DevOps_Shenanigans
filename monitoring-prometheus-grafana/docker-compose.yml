name: monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Containers with these labels are found by Prometheus' docker service discovery
x-scrape: &scrape
  prometheus.scrape: "true"

services:
  # ---------------- the application being monitored ----------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped
    logging: *logging

  app:
    build: ./app
    environment:
      REDIS_URL: redis://redis:6379
    labels:
      <<: *scrape
      prometheus.port: "3000"
    depends_on: [redis]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *logging

  load-generator:
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "/load-generator.sh"]
    volumes:
      - ./scripts/load-generator.sh:/load-generator.sh:ro
    depends_on: [nginx]
    restart: unless-stopped
    logging: *logging

  # ---------------- exporters ----------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro
    labels:
      <<: *scrape
      prometheus.port: "9100"
    restart: unless-stopped
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://nginx/stub_status"]
    labels:
      <<: *scrape
      prometheus.port: "9113"
    depends_on: [nginx]
    restart: unless-stopped
    logging: *logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
    labels:
      <<: *scrape
      prometheus.port: "9121"
    depends_on: [redis]
    restart: unless-stopped
    logging: *logging

  shop-exporter:
    build: ./custom-exporter
    environment:
      REDIS_HOST: redis
    labels:
      <<: *scrape
      prometheus.port: "9200"
    depends_on: [redis]
    restart: unless-stopped
    logging: *logging

  # ---------------- monitoring stack ----------------
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # retention policy: whichever limit is hit first
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle             # allows: curl -X POST localhost:9090/-/reload
    # root is needed to read the Docker socket for service discovery
    user: root
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    logging: *logging

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    logging: *logging

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SMTP_ENABLED: ${SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-grafana@example.com}
      ALERT_EMAIL: ${ALERT_EMAIL:-alerts@example.com}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki]
    restart: unless-stopped
    logging: *logging

volumes:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
